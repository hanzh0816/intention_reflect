_target_: src.models.spike_planner.SNNPlanningModel
_convert_: "all"

# Architecture parameters (same as planTF)
dim: 128
state_channel: 6
polygon_channel: 6
history_channel: 9
history_steps: 21
future_steps: 80
encoder_depth: 4
drop_path: 0.2
num_heads: 8
num_modes: 6
state_dropout: 0.75
use_ego_history: false
state_attn_encoder: true

# SNN-specific parameters
time_steps: 4         # Number of SNN simulation time steps
tau: 2.0             # LIF neuron time constant
v_threshold: 0.5     # Voltage threshold for attention neurons
scale: 0.25          # Attention scaling factor
backend: 'torch'     # Backend for spikingjelly ('torch' or 'cupy')

# Feature builder (same as planTF)
feature_builder:
  _target_: src.feature_builders.nuplan_feature_builder.NuplanFeatureBuilder
  _convert_: "all"
  radius: 100
  history_horizon: 2
  future_horizon: 8
  sample_interval: 0.1
  max_agents: 32
