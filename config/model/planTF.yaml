_target_: src.models.planTF.planning_model.PlanningModel
_convert_: "all"

dim: 128
state_channel: 6
polygon_channel: 6
history_channel: 9
history_steps: 21
future_steps: 80
encoder_depth: 4
drop_path: 0.2
num_heads: 8
num_modes: 6
state_dropout: 0.75
use_ego_history: false
state_attn_encoder: true

feature_builder:
  _target_: src.feature_builders.nuplan_feature_builder.NuplanFeatureBuilder
  _convert_: "all"
  radius: 100
  history_horizon: 2
  future_horizon: 8
  sample_interval: 0.1
  max_agents: 32

# Unified SNN configuration
snn_cfg:
  population_size: 10  # Number of neurons per intent class (population coding)
  neuron_cfg:
    spike_mode: lif
    tau: 2.0
    v_threshold: 1.0
    v_reset: 0.0
    detach_reset: true
    backend: torch
  time_steps: 8
  use_stdp: true
  stdp_cfg:
    learning_rate: 0.0015
    A_pre: 0.01
    A_post: -0.01
    tau_pre: 10.0
    tau_post: 10.0
